<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),sp=new Map();
let W=cv.width=Math.max(320,innerWidth/2|0),H=cv.height=Math.max(200,innerHeight/2|0),ac=null,au=1,t=0,sc=0,hp=100,fr=.5,ch=1,mo=1,df=1,K={},pts=0,step=0,last=performance.now(),pSnd=0,cTmr=0;
let polys=[],bots=[],beams=[],tanks=[],planes=[],shells=[],booms=[],apples=[],dlgQ=[],pl={x:0,y:2.4,vy:0,z:-85,yaw:0,c:'ru',tm:'blue',rec:0,stm:3,dt:0,sl:0,hl:0};
const C={ru:{n:'Россия',s:'blue',u:'#6b633c',h:'#524b2d'},fr:{n:'Франция',s:'blue',u:'#496b8a',h:'#365169'},uk:{n:'Британия',s:'blue',u:'#6e5f41',h:'#4f4632'},us:{n:'США',s:'blue',u:'#5e5b3e',h:'#45432d'},it:{n:'Италия',s:'blue',u:'#566658',h:'#3f4a40'},rs:{n:'Сербия',s:'blue',u:'#595849',h:'#403f34'},de:{n:'Германия',s:'red',u:'#535e54',h:'#384039'},ah:{n:'Австро-Венгрия',s:'red',u:'#596873',h:'#3f4a52'},tr:{n:'Турция',s:'red',u:'#6e6249',h:'#524835'},bg:{n:'Болгария',s:'red',u:'#615843',h:'#453e2f'}};
const MOS=['ЯНВ','ФЕВ','МАР','АПР','МАЙ','ИЮН','ИЮЛ','АВГ','СЕН','ОКТ','НОЯ','ДЕК'];
const EV60=[['ПОДГОТОВКА','КРИЗИС','МАНЁВРЫ','БАЛКАНЫ','МОБИЛИЗАЦИЯ','САРАЕВО','УЛЬТИМАТУМ','БЕЛЬГИЯ','ЧУДО НА МАРНЕ','БЕГ К МОРЮ','ПЕРВЫЙ ИПР','ПЕРЕМИРИЕ'],['ЗИМНИЕ ОКОПЫ','ШАМПАНЬ','ДАРДАНЕЛЛЫ','ГАЗ ПОД ИПРОМ','ГОРЛИЦЕ','ГАЛЛИПОЛИ','ИЗОНЦО','АТАКА МЕРТВЕЦОВ','ОТСТУПЛЕНИЕ','ЛООС','СЕРБИЯ','ОБОРОНА'],['ВЕРДЕН','ФОРТ ДУОМОН','НАРОЧЬ','ЭЛЬ-КУТ','БРУСИЛОВСКИЙ ПРОРЫВ','ЮТЛАНДИЯ','СОММА','ФОРТ ВО','ТАНКИ MARK I','КОНТРУДАР','МОНАСТИР','ЗИМА'],['ГИНДЕНБУРГ','РЕВОЛЮЦИЯ','БАГДАД','США • ВИМИ','МЕССИНА','НАСТУПЛЕНИЕ','ПАСХЕНДАЛЬ','РИГА','ЗАТИШЬЕ','КАПОРЕТТО','КАМБРЕ','ЗИМА 1917'],['ПЕРЕГОВОРЫ','ЗИМНИЕ БОИ','МИХАЭЛЬ','ЛИС','ЛЕС БЕЛЛО','ВТОРАЯ МАРНА','АМЬЕН','СТОДНЕВНОЕ','СЕН-МИЕЛЬ','ПРОРЫВ ЛИНИИ','МЁЗ-АРГОНН','КОМПЬЕН (ФИНАЛ)']];
const DF=[{dmg:100,ed:2,esr:.18,sp:3.2,cnt:16,cd:3.4},{dmg:65,ed:7,esr:.35,sp:4.8,cnt:26,cd:2.1},{dmg:45,ed:18,esr:.62,sp:6.8,cnt:38,cd:1.2},{dmg:32,ed:38,esr:.9,sp:9.2,cnt:52,cd:.65}];
function clean(im){const f=document.createElement('canvas'),w=im.width||64,h=im.height||64;f.width=w;f.height=h;const x=f.getContext('2d');x.drawImage(im,0,0);try{const id=x.getImageData(0,0,w,h),d=id.data,v=new Uint8Array(w*h),q=[];for(let i=0;i<w;i++){q.push(i);q.push((h-1)*w+i);}for(let j=0;j<h;j++){q.push(j*w);q.push(j*w+w-1);}while(q.length){const i=q.pop();if(v[i])continue;v[i]=1;const p=i*4;if(d[p]>230&&d[p+1]>230&&d[p+2]>230){d[p+3]=0;const xx=i%w,yy=(i/w)|0;if(xx>0)q.push(i-1);if(xx<w-1)q.push(i+1);if(yy>0)q.push(i-w);if(yy<h-1)q.push(i+w);}}x.putImageData(id,0,0);}catch(e){}return f;}
['rifle','beam'].forEach(n=>{const m=new Image();m.onload=()=>sp.set(n,clean(m));m.src=n+'.png';});
function uAud(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();}
onresize=()=>{W=cv.width=Math.max(320,innerWidth/2|0);H=cv.height=Math.max(200,innerHeight/2|0)};
onkeydown=e=>{if(document.activeElement.id=='cin')return;uAud();K[e.code]=1;if(e.code=='KeyF')shoot();if(e.code=='KeyH')heal();if(e.code=='KeyT'){e.preventDefault();document.getElementById('cin').focus();}if(e.code=='ShiftLeft'||e.code=='ShiftRight')dash();if(e.code=='Space'&&pl.y<=2.45){pl.vy=15;beep('sine',180,440,.12,.08)}if(e.code=='KeyC'||e.code=='ControlLeft')pl.sl=1;if(e.code=='Enter'&&dlgQ.length)nextDlg();};
onkeyup=e=>{K[e.code]=0;if(e.code=='KeyC'||e.code=='ControlLeft')pl.sl=0};
onmousemove=e=>pl.yaw=((e.clientX/innerWidth)-.5)*3.4+(pl.tm=='red'?Math.PI:0);onmousedown=e=>{uAud();if(e.target==cv)shoot()};
function beep(tp1,f1,f2,dur,vol){if(!au)return;uAud();try{const n=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();o.type=tp1;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),n+dur);gn.gain.setValueAtTime(vol,n);gn.gain.exponentialRampToValueAtTime(.001,n+dur);o.connect(gn);gn.connect(ac.destination);o.start(n);o.stop(n+dur);}catch(e){}}
function noise(dur,vol,freq){if(!au)return;uAud();try{const sr=ac.sampleRate,len=sr*dur,buf=ac.createBuffer(1,len,sr),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(len*.35));const src=ac.createBufferSource(),flt=ac.createBiquadFilter(),gn=ac.createGain();src.buffer=buf;flt.type='lowpass';flt.frequency.value=freq;gn.gain.value=vol;src.connect(flt);flt.connect(gn);gn.connect(ac.destination);src.start();}catch(e){}}
const gLead=,gBass=;
function snd(tg){uAud();if(tg)au=!au;document.getElementById('sndB').innerText=au?'🔊':'🔇';}
setInterval(()=>{if(!au||!ac||ac.state!='running')return;const i=step%32,ld=gLead[i],bs=gBass[i];if(ld)beep('square',ld,ld*.995,.09,.045);if(bs)beep('sawtooth',bs,bs*.55,.11,.08);if(i%4==0)beep('triangle',155,34,.095,.12);if(i%4==2)noise(.06,.08,2400);step++;},105);
function getSeason(){return mo==12||mo<=2?{n:'ЗИМА',sky:'#1c2838',hor:'#5a6b82',gnd:'#dce6f2',tr:'#8a99ad',w:'snow'}:mo<=5?{n:'ВЕСНА',sky:'#16241c',hor:'#3c5947',gnd:'#2d4a26',tr:'#3d2b1f',w:'rain'}:mo<=8?{n:'ЛЕТО',sky:'#18365c',hor:'#4a85c4',gnd:'#3b6324',tr:'#4d3622',w:'sun'}:{n:'ОСЕНЬ',sky:'#24160e',hor:'#693a1e',gnd:'#47331e',tr:'#3b2818',w:'fog'};}
function addStyle(v,txt){pts=Math.min(700,pts+v);document.getElementById('slog').innerText=txt;}
function dash(){if(pl.stm>=1&&pl.dt<=0){pl.stm--;pl.dt=.2;beep('sawtooth',520,140,.15,.1)}}
function heal(){if(pl.hl>0||hp>=100)return;pl.hl=6;hp=Math.min(100,hp+50);addStyle(40,'+50HP');beep('sine',440,880,.18,.12);addMsg('МЕДИК','Перевязка (+50 HP)!','#0f6');}
function addMsg(who,txt,col){const el=document.getElementById('clog');el.innerHTML+='<div><b style="color:'+(col||'#fe0')+'">['+who+']:</b> '+txt+'</div>';el.scrollTop=el.scrollHeight;}
function sendChat(e){e.preventDefault();const inp=document.getElementById('cin'),txt=inp.value.trim();inp.value='';inp.blur();if(!txt)return;const inf=C[pl.c]||C.ru,q=txt.toLowerCase();addMsg('ВЫ',txt,'#5cf');setTimeout(()=>{let r='Принято! Продолжаем наступление за '+inf.n+'!';if(q.includes('хп')||q.includes('леч')||q.includes('аптеч')){hp=Math.min(100,hp+40);r='Санитары на месте (+40 HP)! Жми H или бери яблоки!';}else if(q.includes('атак')||q.includes('вперед')||q.includes('штурм')){fr=Math.min(.95,Math.max(.05,fr+(pl.tm=='blue'?.06:-.06)));r='Всем силам '+inf.n+' — в штыковую атаку!';}else if(q.includes('танк')||q.includes('самолет'))r='Бей по технике с фланга, за неё дают +50 HP!';else if(q.includes('привет')||q.includes('один')||q.includes('скуч'))r='Здравия желаю! Полк '+inf.n+' рядом и прикрывает тебя!';else if(q.includes('помощ')||q.includes('подкреп')){spawnWave();r='Свежее подкрепление '+inf.n+' вышло на рубеж!';}addMsg('ГЕНЕРАЛ ('+inf.n+')',r,'#fe0');beep('triangle',420,640,.1,.07);},350);}
function flag(x,c,X,Y,w,h){x.fillStyle='#fff';x.fillRect(X,Y,w,h);const s=(a,b,d)=>{x.fillStyle=a;x.fillRect(X,Y,w,h/3);x.fillStyle=b;x.fillRect(X,Y+h/3,w,h/3);x.fillStyle=d;x.fillRect(X,Y+2*h/3,w,h/3)},v=(a,b,d)=>{x.fillStyle=a;x.fillRect(X,Y,w/3,h);x.fillStyle=b;x.fillRect(X+w/3,Y,w/3,h);x.fillStyle=d;x.fillRect(X+2*w/3,Y,w/3,h)};if(c=='ru'){s('#fff','#0039a6','#d52b1e');x.fillStyle='#f5d130';x.fillRect(X,Y,w*.46,2*h/3);x.fillStyle='#111';x.fillRect(X+w*.16,Y+h*.18,w*.14,h*.3)}else if(c=='fr')v('#002395','#fff','#ed2939');else if(c=='it')v('#009246','#fff','#ce2b37');else if(c=='rs')s('#c6363c','#0c4076','#fff');else if(c=='de')s('#111','#fff','#d00');else if(c=='bg')s('#fff','#00966e','#d62612');else if(c=='ah'){s('#ed2939','#fff','#ed2939');x.fillStyle='#008751';x.fillRect(X+w/2,Y+2*h/3,w/2,h/3)}else if(c=='tr'){x.fillStyle='#e30a17';x.fillRect(X,Y,w,h);x.fillStyle='#fff';x.beginPath();x.arc(X+w*.42,Y+h/2,h*.26,0,7);x.fill();x.fillStyle='#e30a17';x.beginPath();x.arc(X+w*.48,Y+h/2,h*.21,0,7);x.fill()}else if(c=='uk'){x.fillStyle='#012169';x.fillRect(X,Y,w,h);x.fillStyle='#fff';x.fillRect(X+w*.4,Y,w*.2,h);x.fillRect(X,Y+h*.36,w,h*.28);x.fillStyle='#c8102e';x.fillRect(X+w*.44,Y,w*.12,h);x.fillRect(X,Y+h*.42,w,h*.16)}else if(c=='us'){for(let i=0;i<7;i++){x.fillStyle=i%2?'#fff':'#b22234';x.fillRect(X,Y+i*h/7,w,h/7)}x.fillStyle='#3c3b6e';x.fillRect(X,Y,w*.45,h*.55)}}
function showScene(evT){const inf=C[pl.c]||C.ru,enC=pl.tm=='blue'?'ah':'ru',enInf=C[enC];dlgQ=[{who:'РЯДОВОЙ ('+inf.n+')',c:pl.c,u:inf.u,txt:'Рубеж: '+evT+'. Жми H для аптечки (+50HP) или пиши Генералу (T)!'},{who:'РАЗВЕДЧИК ('+enInf.n+')',c:enC,u:enInf.u,txt:'Враг атакует! Огонь!'}];nextDlg();}
function nextDlg(){const d=dlgQ.shift(),box=document.getElementById('dlg');if(!d){box.style.display='none';return;}box.style.display='flex';document.getElementById('dlgN').innerText=d.who;document.getElementById('dlgM').innerText=d.txt;const cx=document.getElementById('dlgC').getContext('2d');cx.fillStyle='#1f1612';cx.fillRect(0,0,56,44);flag(cx,d.c,3,3,20,12);cx.fillStyle=d.u;cx.fillRect(20,22,16,22);cx.fillStyle='#fdb';cx.fillRect(23,11,10,11);}
function setC(){pl.c=document.getElementById('cs').value;let i=C[pl.c]||C.ru;pl.tm=i.s;pl.z=pl.tm=='blue'?-85:85;pl.yaw=pl.tm=='blue'?0:Math.PI;flag(document.getElementById('fp').getContext('2d'),pl.c,0,0,32,18);addMsg('ШТАБ','Сторона: '+i.n+'. Генерал на связи!','#fe0');spawnWave();}
function setCh(rst){ch=+document.getElementById('chs').value;if(rst){mo=1;document.getElementById('mos').value=1;}const yr=1913+ch,mName=MOS[mo-1],evT=EV60[ch-1][mo-1],sea=getSeason();document.getElementById('ct').innerText=mName+' '+yr+' • '+sea.n;document.getElementById('ev').innerText=yr+' • '+mName+' ('+mo+'/12): '+evT;document.getElementById('stN').innerText=((ch-1)*12+mo)+'/60';fr=.5;hp=100;document.getElementById('win').style.display='none';spawnWave();showScene(evT);}
function nxt(){if(mo<12){mo++;document.getElementById('mos').value=mo;setCh(0);}else if(ch<5){document.getElementById('chs').value=ch+1;setCh(1);}else{document.getElementById('chs').value=1;setCh(1);}}

<script>
function spawnWave(){bots=[];tanks=[];planes=[];beams=[];shells=[];booms=[];apples=[];const dI=DF[df-1]||DF,bl=['ru','fr','uk','us','it','rs'],rd=['de','ah','tr','bg'];for(let i=0;i<dI.cnt;i++){const isB=i<dI.cnt/2;bots.push({x:(Math.random()-.5)*110,z:(isB?-1:1)*(25+Math.random()*65),tm:isB?'blue':'red',c:isB?bl[i%6]:rd[i%4],hp:100,cd:Math.random()*2,ph:i});}for(let i=0;i<2+ch;i++){const isB=i%2==0;tanks.push({x:(i-2)*22,z:(isB?-70:70),tm:isB?'blue':'red',hp:320,cd:3+Math.random()*2});}for(let i=0;i<3;i++){const isB=i%2==0;planes.push({x:(i-1)*32,y:23+i*3,z:(isB?-90:90),tm:isB?'blue':'red',hp:120,cd:3+i});}for(let i=0;i<14;i++)apples.push({x:(Math.random()-.5)*100,z:(Math.random()-.5)*140,act:1});}
function proj(wx,wy,wz){let dx=wx-pl.x,dy=wy-pl.y,dz=wz-pl.z,sn=Math.sin(pl.yaw),cs=Math.cos(pl.yaw),rx=dx*cs-dz*sn,rz=dx*sn+dz*cs;if(rz<.5)return null;let fov=Math.min(W,H)*.85;return{x:W/2+(rx/rz)*fov,y:H/2-(dy/rz)*fov,z:rz};}
function addBox(x,y,z,w,h,d,c1,c2,c3){const hw=w/2,hh=h/2,hd=d/2,p=[proj(x-hw,y+hh,z-hd),proj(x+hw,y+hh,z-hd),proj(x+hw,y+hh,z+hd),proj(x-hw,y+hh,z+hd),proj(x-hw,y-hh,z-hd),proj(x+hw,y-hh,z-hd),proj(x+hw,y-hh,z+hd),proj(x-hw,y-hh,z+hd)];if(p.some(v=>!v))return;const f=(a,b,c,e,col)=>polys.push({pts:[p[a],p[b],p[c],p[e]],z:(p[a].z+p[b].z+p[c].z+p[e].z)/4,c:col});f(0,1,2,3,c1);f(4,5,1,0,c3);f(5,6,2,1,c2);f(7,4,0,3,c2);f(6,7,3,2,c3);}
function addBoom(x,y,z){for(let i=0;i<8;i++)booms.push({x,y:y+1,z,vx:(Math.random()-.5)*16,vy:4+Math.random()*12,vz:(Math.random()-.5)*16,l:.6,c:i%2?'#f80':'#fe0'});noise(.35,.35,280);beep('sawtooth',95,22,.32,.15);}
function shoot(){if(pl.rec>0)return;pl.rec=.18;noise(.16,.32,1400);beep('sawtooth',720,85,.13,.12);const sn=Math.sin(pl.yaw),cs=Math.cos(pl.yaw);beams.push({x1:pl.x+sn*.8,y1:pl.y-.35,z1:pl.z+cs*.8,x2:pl.x+sn*85,y2:2,z2:pl.z+cs*85,l:.22,col:'#fa0',useImg:1});const dI=DF[df-1]||DF;bots.forEach(b=>{if(b.hp>0&&b.tm!=pl.tm){const dl=Math.abs((b.x-pl.x)*cs-(b.z-pl.z)*sn),fw=(b.x-pl.x)*sn+(b.z-pl.z)*cs;if(dl<1.7&&fw>0&&fw<85){b.hp-=dI.dmg;if(b.hp<=0){sc++;hp=Math.min(100,hp+25);fr=Math.max(0,Math.min(1,fr+(pl.tm=='blue'?.04:-.04)));addBoom(b.x,0,b.z);addStyle(90,'+KILL +25HP');}}}});tanks.forEach(tk=>{if(tk.hp>0&&tk.tm!=pl.tm){const dl=Math.abs((tk.x-pl.x)*cs-(tk.z-pl.z)*sn),fw=(tk.x-pl.x)*sn+(tk.z-pl.z)*cs;if(dl<3&&fw>0&&fw<90){tk.hp-=dI.dmg;if(tk.hp<=0){sc+=4;hp=Math.min(100,hp+50);fr=Math.max(0,Math.min(1,fr+(pl.tm=='blue'?.09:-.09)));addBoom(tk.x,1,tk.z);addStyle(250,'+TANK +50HP');}}}});planes.forEach(pn=>{if(pn.hp>0&&pn.tm!=pl.tm){const dl=Math.abs((pn.x-pl.x)*cs-(pn.z-pl.z)*sn),fw=(pn.x-pl.x)*sn+(pn.z-pl.z)*cs;if(dl<3.8&&fw>0&&fw<95){pn.hp-=dI.dmg;if(pn.hp<=0){sc+=5;hp=Math.min(100,hp+50);fr=Math.max(0,Math.min(1,fr+(pl.tm=='blue'?.1:-.1)));addBoom(pn.x,pn.y,pn.z);addStyle(300,'+PLANE +50HP');}}}});}
function loop(now){
  requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;pSnd+=dt;cTmr+=dt;
  if(pl.rec>0)pl.rec-=dt;if(pl.dt>0)pl.dt-=dt;if(pl.hl>0)pl.hl-=dt;pl.stm=Math.min(3,pl.stm+dt*.5);pts=Math.max(0,pts-dt*12);
  const dI=DF[df-1]||DF,sea=getSeason();
  if(cTmr>9){cTmr=0;const inf=C[pl.c]||C.ru,ls=['Рядовой Орлов: Прикрываю слева!','Сержант Волков: Отличный выстрел!','Генерал ('+inf.n+'): Ранен — жми H или бери яблоки!','Связист: Рация работает, ждём приказов в чате!'];addMsg('РАЦИЯ',ls[Math.floor(Math.random()*ls.length)],'#9f9');}
  if(pl.y>2.4||pl.vy){pl.y+=pl.vy*dt;pl.vy-=35*dt;if(pl.y<=2.4){pl.y=2.4;pl.vy=0;}}if(pl.vy==0)pl.y+=((pl.sl?1.3:2.4)-pl.y)*.25;
  let spd=pl.dt>0?36:pl.sl?20:14;const sn=Math.sin(pl.yaw),cs=Math.cos(pl.yaw);
  if(K.KeyW||K.ArrowUp){pl.x+=sn*spd*dt;pl.z+=cs*spd*dt;}if(K.KeyS||K.ArrowDown){pl.x-=sn*spd*dt;pl.z-=cs*spd*dt;}
  if(K.KeyA){pl.x-=cs*spd*dt;pl.z+=sn*spd*dt;}if(K.KeyD){pl.x+=cs*spd*dt;pl.z-=sn*spd*dt;}
  if(K.ArrowLeft)pl.yaw-=2.3*dt;if(K.ArrowRight)pl.yaw+=2.3*dt;
  pl.x=Math.max(-65,Math.min(65,pl.x));pl.z=Math.max(-105,Math.min(105,pl.z));
  if(df>=3&&Math.random()<dt*(df*.45))shells.push({x:pl.x+(Math.random()-.5)*35,y:28,z:pl.z+(Math.random()-.5)*35,vy:-36,vz:0,tm:'art',l:1.2});
  bots.forEach(b=>{if(b.hp<=0){b.hp-=dt;if(b.hp<-3.5){b.hp=100;b.z=(b.tm=='blue'?-1:1)*(65+Math.random()*30);b.x=(Math.random()-.5)*110;}return;}const dz=b.tm=='blue'?1:-1;if(Math.abs(b.z)>8)b.z+=dz*dI.sp*dt;b.cd-=dt;if(b.cd<=0){b.cd=dI.cd+Math.random()*1.5;if(b.tm!=pl.tm&&Math.hypot(b.x-pl.x,b.z-pl.z)<50&&pl.dt<=0){beams.push({x1:b.x,y1:1.6,z1:b.z,x2:pl.x,y2:pl.y-.2,z2:pl.z,l:.14,col:'#f33',useImg:0});if(Math.random()<dI.esr){hp-=dI.ed;document.getElementById('dmg').style.opacity=1;setTimeout(()=>document.getElementById('dmg').style.opacity=0,110);beep('square',120,45,.15,.1);}}}});
  tanks.forEach(tk=>{if(tk.hp<=0)return;tk.z+=(tk.tm=='blue'?1:-1)*2.8*dt;if(Math.abs(tk.z)>85)tk.z=(tk.tm=='blue'?-75:75);tk.cd-=dt;if(tk.cd<=0){tk.cd=df==4?2:4.5;shells.push({x:tk.x,y:1.8,z:tk.z,vy:0,vz:(tk.tm=='blue'?1:-1)*30,tm:tk.tm,l:3});}});
  let hasP=0;planes.forEach(pn=>{if(pn.hp<=0)return;hasP=1;pn.z+=(pn.tm=='blue'?1:-1)*16*dt;if(Math.abs(pn.z)>110)pn.z=(pn.tm=='blue'?-100:100);pn.cd-=dt;if(pn.cd<=0){pn.cd=3.5;shells.push({x:pn.x,y:pn.y-1,z:pn.z,vy:-20,vz:(pn.tm=='blue'?1:-1)*10,tm:pn.tm,l:2});}});
  if(hasP&&pSnd>.45){pSnd=0;beep('sawtooth',88,72,.35,.035);}
  shells.forEach(s=>{s.y+=(s.vy||0)*dt;s.z+=(s.vz||0)*dt;s.l-=dt;if(s.y<=0){addBoom(s.x,0,s.z);if(Math.hypot(s.x-pl.x,s.z-pl.z)<6&&pl.dt<=0)hp-=dI.ed*1.2;s.l=0;}else if(s.tm!=pl.tm&&s.tm!='art'&&Math.hypot(s.x-pl.x,s.z-pl.z)<3&&pl.dt<=0){hp-=dI.ed*1.3;addBoom(s.x,s.y,s.z);s.l=0;}});
  shells=shells.filter(s=>s.l>0);beams=beams.filter(b=>{b.l-=dt;return b.l>0;});
  booms.forEach(bm=>{bm.x+=bm.vx*dt;bm.y+=bm.vy*dt;bm.z+=bm.vz*dt;bm.vy-=20*dt;bm.l-=dt;});booms=booms.filter(bm=>bm.l>0);
  apples.forEach(ap=>{if(ap.act&&Math.hypot(ap.x-pl.x,ap.z-pl.z)<2.6){ap.act=0;hp=Math.min(100,hp+50);addStyle(90,'+APPLE +50HP');beep('sine',520,880,.15,.1);}});
  if(hp<=0){hp=100;pl.z=pl.tm=='blue'?-85:85;pts=0;addMsg('МЕДИК','Снова в строй!','#fa0');}
  if(fr>=1||fr<=0){const fin=ch==5&&mo==12;document.getElementById('wt').innerText=fin?'ПОБЕДА! ВСЕ 60 МЕСЯЦЕВ ПРОЙДЕНЫ!':'МЕСЯЦ ПРОЙДЕН ('+((ch-1)*12+mo)+'/60)!';document.getElementById('win').style.display='flex';}
  document.getElementById('hp').innerText=Math.max(0,hp|0);document.getElementById('hl').innerText=pl.hl>0?Math.ceil(pl.hl)+'с':'OK';document.getElementById('sc').innerText=sc;
  const bp=Math.round(fr*100);document.getElementById('bp').innerText=bp;document.getElementById('rp').innerText=100-bp;document.getElementById('bf').style.width=bp+'%';
  document.getElementById('rk').innerText=['D','C','B','A','S','SS','SSS','ULTRAKILL'][Math.min(7,Math.floor(pts/85))];
  polys=[];g.fillStyle=sea.sky;g.fillRect(0,0,W,H/2);g.fillStyle=sea.hor;g.fillRect(0,H*.32,W,H*.18);g.fillStyle=sea.gnd;g.fillRect(0,H/2,W,H/2);
  for(let gz=-100;gz<=100;gz+=16){for(let gx=-60;gx<=60;gx+=20)if(Math.abs(gx-pl.x)<85&&Math.abs(gz-pl.z)<95)addBox(gx,-.1,gz,20,.2,16,sea.gnd,sea.tr,sea.gnd);if(Math.abs(gz)==20||Math.abs(gz)==52||Math.abs(gz)==84)addBox(0,.65,gz,130,1.3,1.4,sea.tr,'#2b1e14',sea.tr);}
  apples.forEach(ap=>{addBox(ap.x,2.5,ap.z-2,.7,5,.7,'#5c3a21','#422816','#4f311b');addBox(ap.x,5.2,ap.z-2,3.4,2.4,3.4,sea.w=='snow'?'#eef':'#2e8b2e','#1f631f','#267526');if(ap.act)addBox(ap.x,.6+Math.sin(t*4)*.15,ap.z,.7,.7,.7,'#f22','#b00','#d11');});
  bots.forEach(b=>{if(b.hp<=0)return;const inf=C[b.c]||C.ru,sw=Math.sin(t*9+b.ph)*.3;addBox(b.x-.25,.5,b.z+sw,.4,1,.4,'#222','#111','#222');addBox(b.x+.25,.5,b.z-sw,.4,1,.4,'#222','#111','#222');addBox(b.x,1.5,b.z,.95,1.1,.5,inf.u,inf.h,inf.u);addBox(b.x,2.35,b.z,.65,.65,.65,'#fdb','#e9b','#fca');addBox(b.x,2.72,b.z,.78,.28,.78,b.tm=='blue'?'#26c':'#d22',inf.h,inf.h);});
  tanks.forEach(tk=>{if(tk.hp<=0)return;const c1=tk.tm=='blue'?'#4a607a':'#5e6358',dz=tk.tm=='blue'?2.6:-2.6;addBox(tk.x,.9,tk.z,3.8,1.3,5.6,c1,'#222','#333');addBox(tk.x,1.9,tk.z,2.1,.8,2.4,tk.tm=='blue'?'#28f':'#f33','#222','#333');addBox(tk.x,1.9,tk.z+dz,.35,.35,2.4,'#222','#111','#222');});
  planes.forEach(pn=>{if(pn.hp<=0)return;const c1=pn.tm=='blue'?'#3b7dd8':'#d83b3b',dz=pn.tm=='blue'?2.6:-2.6;addBox(pn.x,pn.y,pn.z,1.1,1,4.8,c1,'#222','#333');addBox(pn.x,pn.y+.7,pn.z+.4,7.5,.18,1.3,'#ddd','#aaa','#ccc');addBox(pn.x,pn.y-.3,pn.z+.4,7.5,.18,1.3,'#ddd','#aaa','#ccc');addBox(pn.x,pn.y+.4,pn.z-dz,2.4,.8,.6,c1,'#222','#333');addBox(pn.x,pn.y,pn.z+dz,Math.sin(t*40)*2.2,Math.cos(t*40)*2.2,.2,'#fe0','#fa0','#fe0');});
  shells.forEach(s=>addBox(s.x,s.y,s.z,.45,.45,1.2,'#fe0','#f80','#ff0'));booms.forEach(bm=>addBox(bm.x,bm.y,bm.z,bm.l*2.5,bm.l*2.5,bm.l*2.5,bm.c,'#f30','#fa0'));
  polys.sort((a,b)=>b.z-a.z);polys.forEach(p=>{g.fillStyle=p.c;g.beginPath();p.pts.forEach((pt,i)=>i?g.lineTo(pt.x,pt.y):g.moveTo(pt.x,pt.y));g.closePath();g.fill();});
  if(sea.w=='snow'||sea.w=='rain'){g.fillStyle=sea.w=='snow'?'#fff':'#7cf';for(let i=0;i<45;i++)g.fillRect((i*73+t*(sea.w=='snow'?40:180))%W,(i*41+t*(sea.w=='snow'?70:320))%H,sea.w=='snow'?3:1,sea.w=='snow'?3:8);}
  if(sea.w=='fog'){g.fillStyle='rgba(160,130,90,.16)';g.fillRect(0,0,W,H);}
  const trIm=sp.get('beam');beams.forEach(b=>{const p1=proj(b.x1,b.y1,b.z1),p2=proj(b.x2,b.y2,b.z2);if(p1&&p2){if(b.useImg&&trIm){const dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)+Math.PI/2;g.save();g.translate(p1.x,p1.y);g.rotate(ang);g.drawImage(trIm,-10,-len,20,len);g.restore();}else{g.strokeStyle=b.col;g.lineWidth=3;g.beginPath();g.moveTo(p1.x,p1.y);g.lineTo(p2.x,p2.y);g.stroke();}}});
  const kick=pl.rec*42,gIm=sp.get('rifle');if(gIm)g.drawImage(gIm,W*.54,H*.48+kick,W*.28,H*.54);else{g.fillStyle='#333';g.fillRect(W*.62,H*.68+kick,W*.12,H*.32);}if(pl.rec>.15){g.fillStyle='#fe0';g.beginPath();g.arc(W*.68,H*.5+kick,14,0,7);g.fill();}
}
setC();setCh(1);requestAnimationFrame(loop);
</script></body></html>
