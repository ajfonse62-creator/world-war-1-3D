<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>WW1 FRONT WARS 3D</title><script src="https://unpkg.com"></script><style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#1a1510;overflow:hidden;font:bold 12px monospace;color:#fff;user-select:none;cursor:crosshair;touch-action:none}
canvas{display:block;width:100vw;height:100vh}#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:8px}
.top{display:flex;flex-wrap:wrap;gap:4px;justify-content:space-between}.box{display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:rgba(15,10,6,.9);border:2px solid #d48b3b;padding:4px 7px;pointer-events:auto}
input,select,button{background:#2b1d12;border:1px solid #d48b3b;color:#fff;padding:3px 5px;font:inherit}input{width:62px}button{background:#6b3b1e;cursor:pointer}
#bar{width:100%;max-width:500px;height:20px;background:#8c2626;border:2px solid #fff;margin:4px auto 0;position:relative}#bf{height:100%;width:50%;background:#2664b8;transition:.2s}
#bt{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 6px;font-size:11px;text-shadow:1px 1px 0 #000}
#mob{display:flex;justify-content:space-between;align-items:flex-end}.pad{display:grid;grid-template-columns:repeat(3,42px);gap:3px;pointer-events:auto}.pad button{height:42px;background:rgba(40,28,18,.8)}
#fire{pointer-events:auto;width:74px;height:74px;border-radius:50%;background:rgba(200,60,20,.9);border:3px solid #fe0}
#win{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:9}
</style></head><body><canvas id="c"></canvas>
<div id="ui"><div><div class="top"><div class="box">
  <button onclick="snd()">🔊</button><input id="nk" value="Боец"><canvas id="fp" width="30" height="20"></canvas>
  <select id="cs" onchange="setC()"><option value="ru">Россия</option><option value="fr">Франция</option><option value="uk">Британия</option><option value="us">США</option><option value="it">Италия</option><option value="rs">Сербия</option><option value="de">Германия</option><option value="ah">Австро-Венгр.</option><option value="tr">Турция</option><option value="bg">Болгария</option></select>
  <select id="chs" onchange="setCh()"><option value="1">Гл.1: 1914</option><option value="2">Гл.2: 1915</option><option value="3">Гл.3: 1916</option><option value="4">Гл.4: 1917</option><option value="5">Гл.5: 1918</option></select>
  <select id="dfs" onchange="df=+this.value"><option value="1">Лёгкий</option><option value="2" selected>Средний</option><option value="3">Сложный</option><option value="4">ULTRA HARD</option><option value="5">КОШМАР 1918</option></select>
  <input id="rm" value="ww1"><button onclick="net()">🌐 ОНЛАЙН</button><span id="st" style="color:#fa0">ОФФ</span>
</div><div class="box" style="pointer-events:none">HP:<b id="hp" style="color:#4f4">100</b> | ФРАГИ:<b id="sc">0</b> | ОНЛАЙН:<b id="on">1</b></div></div>
<div id="bar"><div id="bf"></div><div id="bt"><span>🔵 АНТАНТА <b id="bp">50</b>%</span><span id="ct">1914 • БОЙ</span><span><b id="rp">50</b>% ИМПЕРИИ 🔴</span></div></div></div>
<div id="mob"><div class="pad"><div></div><button ontouchstart="K.KeyW=1" ontouchend="K.KeyW=0">▲</button><div></div><button ontouchstart="K.ArrowLeft=1" ontouchend="K.ArrowLeft=0">◀</button><button ontouchstart="K.KeyS=1" ontouchend="K.KeyS=0">▼</button><button ontouchstart="K.ArrowRight=1" ontouchend="K.ArrowRight=0">▶</button></div><button id="fire" ontouchstart="shoot()" onmousedown="shoot()">ОГОНЬ</button></div></div>
<div id="win"><h1 id="wt" style="color:#fe0;margin-bottom:12px">ПОБЕДА!</h1><button onclick="nxt()">ДАЛЬШЕ ▶</button></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),myId='p'+Math.random().toString(36).slice(2,8);
let W=cv.width=innerWidth,H=cv.height=innerHeight,ac=null,au=0,t=0,sc=0,hp=100,fr=.5,ch=1,df=2,cl=null,tp='',peers={},K={};
let polys=[],pts=[],bots=[],beams=[],nBeams=[],pl={x:0,z:-16,yaw:0,c:'ru',tm:'blue',rec:0};
const C={
  ru:{s:'blue',u:'#6b633c',h:'#524b2d'}, fr:{s:'blue',u:'#496b8a',h:'#365169'},
  uk:{s:'blue',u:'#6e5f41',h:'#4f4632'}, us:{s:'blue',u:'#5e5b3e',h:'#45432d'},
  it:{s:'blue',u:'#566658',h:'#3f4a40'}, rs:{s:'blue',u:'#595849',h:'#403f34'},
  de:{s:'red',u:'#535e54',h:'#384039'},  ah:{s:'red',u:'#596873',h:'#3f4a52'},
  tr:{s:'red',u:'#6e6249',h:'#524835'},  bg:{s:'red',u:'#615843',h:'#453e2f'}
};
const CH={
  1:{t:'1914 • ПОГРАНИЧНЫЙ БОЙ',a:'#242b38',b:'#6b5c49',tk:0},
  2:{t:'1915 • ОКОПЫ И ГАЗ',a:'#2d331d',b:'#6e733b',tk:0},
  3:{t:'1916 • ВЕРДЕН И БРУСИЛОВ',a:'#331c14',b:'#804126',tk:0},
  4:{t:'1917 • ТАНКОВЫЙ ПРОРЫВ',a:'#26211b',b:'#69533c',tk:1},
  5:{t:'1918 • ФИНАЛЬНЫЙ ШТУРМ',a:'#1f1612',b:'#8a3c1f',tk:1}
};
const DF={
  1:{dmg:60,ed:6,sr:.03,sp:1.6}, 2:{dmg:40,ed:12,sr:.045,sp:2.1},
  3:{dmg:30,ed:20,sr:.06,sp:2.6}, 4:{dmg:22,ed:34,sr:.08,sp:3.2},
  5:{dmg:18,ed:55,sr:.11,sp:3.9}
};
onresize=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};
onkeydown=e=>{if(document.activeElement.tagName!='INPUT'){K[e.code]=1;if(e.code=='Space')shoot()}};
onkeyup=e=>K[e.code]=0;onmousemove=e=>pl.yaw=((e.clientX/W)-.5)*2.6+(pl.tm=='red'?Math.PI:0);onmousedown=e=>{if(e.target==cv)shoot()};
function flag(x,c,X,Y,w,h){
  x.fillStyle='#fff';x.fillRect(X,Y,w,h);
  const s=(a,b,d)=>{x.fillStyle=a;x.fillRect(X,Y,w,h/3);x.fillStyle=b;x.fillRect(X,Y+h/3,w,h/3);x.fillStyle=d;x.fillRect(X,Y+2*h/3,w,h/3)};
  const v=(a,b,d)=>{x.fillStyle=a;x.fillRect(X,Y,w/3,h);x.fillStyle=b;x.fillRect(X+w/3,Y,w/3,h);x.fillStyle=d;x.fillRect(X+2*w/3,Y,w/3,h)};
  if(c=='ru'){s('#fff','#0039a6','#d52b1e');x.fillStyle='#f5d130';x.fillRect(X,Y,w*.46,2*h/3);x.fillStyle='#111';x.fillRect(X+w*.16,Y+h*.18,w*.14,h*.3)}
  else if(c=='fr')v('#002395','#fff','#ed2939');else if(c=='it')v('#009246','#fff','#ce2b37');else if(c=='rs')s('#c6363c','#0c4076','#fff');else if(c=='de')s('#111','#fff','#d00');else if(c=='bg')s('#fff','#00966e','#d62612');
  else if(c=='ah'){s('#ed2939','#fff','#ed2939');x.fillStyle='#008751';x.fillRect(X+w/2,Y+2*h/3,w/2,h/3)}
  else if(c=='tr'){x.fillStyle='#e30a17';x.fillRect(X,Y,w,h);x.fillStyle='#fff';x.beginPath();x.arc(X+w*.42,Y+h/2,h*.26,0,7);x.fill();x.fillStyle='#e30a17';x.beginPath();x.arc(X+w*.48,Y+h/2,h*.21,0,7);x.fill()}
  else if(c=='uk'){x.fillStyle='#012169';x.fillRect(X,Y,w,h);x.fillStyle='#fff';x.fillRect(X+w*.4,Y,w*.2,h);x.fillRect(X,Y+h*.36,w,h*.28);x.fillStyle='#c8102e';x.fillRect(X+w*.44,Y,w*.12,h);x.fillRect(X,Y+h*.42,w,h*.16)}
  else if(c=='us'){for(let i=0;i<7;i++){x.fillStyle=i%2?'#fff':'#b22234';x.fillRect(X,Y+i*h/7,w,h/7)}x.fillStyle='#3c3b6e';x.fillRect(X,Y,w*.45,h*.55)}
}
function setC(){pl.c=document.getElementById('cs').value;pl.tm=C[pl.c].s;flag(document.getElementById('fp').getContext('2d'),pl.c,0,0,30,20);bots=[];resp()}
function setCh(){ch=+document.getElementById('chs').value;document.getElementById('ct').textContent=CH[ch].t;fr=.5;updF();bots=[]}
function resp(){hp=100;document.getElementById('hp').textContent=hp;pl.x=(Math.random()-.5)*18;pl.z=pl.tm=='blue'?-17:17;pl.yaw=pl.tm=='blue'?0:Math.PI}
function updF(){fr=Math.max(0,Math.min(1,fr));let b=Math.round(fr*100);document.getElementById('bf').style.width=b+'%';document.getElementById('bp').textContent=b;document.getElementById('rp').textContent=100-b;if(b>=100||b<=0){document.getElementById('wt').textContent=(b>=100&&pl.tm=='blue')||(b<=0&&pl.tm=='red')?'🏆 ПОБЕДА!':'💀 ПРОРЫВ ВРАГА!';document.getElementById('win').style.display='flex'}}
function nxt(){document.getElementById('win').style.display='none';if(ch<5)document.getElementById('chs').value=++ch;setCh();resp()}
function snd(){try{if(!ac)ac=new(window.AudioContext||webkitAudioContext)();if(ac.state=='suspended')ac.resume();au=!au;if(au)mus()}catch(e){}}
function mus(){if(!au||!ac)return;const notes=new Array(110,110,130.8,146.8,110,110,164.8,146.8);notes.forEach((f,i)=>{let o=ac.createOscillator(),gn=ac.createGain();o.type='sawtooth';o.frequency.value=f;gn.gain.setValueAtTime(.03,ac.currentTime+i*.25);gn.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.25+.23);o.connect(gn);gn.connect(ac.destination);o.start(ac.currentTime+i*.25);o.stop(ac.currentTime+i*.25+.24)});setTimeout(mus,2000)}
function beep(tp,f1,f2,tm,v){if(!au||!ac)return;let o=ac.createOscillator(),gn=ac.createGain();o.type=tp;o.frequency.setValueAtTime(f1,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+tm);gn.gain.setValueAtTime(v,ac.currentTime);gn.gain.exponentialRampToValueAtTime(.001,ac.currentTime+tm);o.connect(gn);gn.connect(ac.destination);o.start();o.stop(ac.currentTime+tm)}
function net(){let r=document.getElementById('rm').value||'ww1';tp='fw18/'+r;if(cl)cl.end(1);cl=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:myId});cl.on('connect',()=>{document.getElementById('st').textContent='В СЕТИ';document.getElementById('st').style.color='#0f6';cl.subscribe(tp)});cl.on('message',(t,m)=>{try{let d=JSON.parse(m);if(d.id==myId)return;if(d.t=='p')peers[d.id]={...d,s:Date.now()};else if(d.t=='s'){nBeams.push({...d,l:1});beep('square',760,90,.14,.06)}else if(d.t=='f'){fr=d.v;updF()}else if(d.t=='h'&&d.tg==myId){hp-=d.d;document.getElementById('hp').textContent=Math.max(0,hp);boom(pl.x,1.5,pl.z);if(hp<=0)resp()}}catch(e){}})}
setInterval(()=>{if(cl&&cl.connected)cl.publish(tp,JSON.stringify({t:'p',id:myId,n:document.getElementById('nk').value,tm:pl.tm,c:pl.c,x:+pl.x.toFixed(1),z:+pl.z.toFixed(1),y:+pl.yaw.toFixed(2)}));for(let k in peers)if(Date.now()-peers[k].s>3500)delete peers[k];document.getElementById('on').textContent=1+Object.keys(peers).length},100);
function proj(p){let dx=p.x-pl.x,dy=p.y-2.3,dz=p.z-pl.z,fx=Math.sin(pl.yaw),fz=Math.cos(pl.yaw),cx=dx*fz-dz*fx,cz=dx*fx+dz*fz;if(cz<=.25)return null;let s=H*.85/cz;return{x:W/2+cx*s,y:H/2-dy*s,z:cz}}
function box(x,y,z,w,h,d,col,ry=0){let hw=w/2,hh=h/2,hd=d/2,cs=Math.cos(ry),sn=Math.sin(ry),tr=(a,b,c)=>proj({x:x+a*cs-c*sn,y:y+b,z:z+a*sn+c*cs});let p0=tr(-hw,-hh,-hd),p1=tr(hw,-hh,-hd),p2=tr(hw,hh,-hd),p3=tr(-hw,hh,-hd),p4=tr(-hw,-hh,hd),p5=tr(hw,-hh,hd),p6=tr(hw,hh,hd),p7=tr(-hw,hh,hd);let add=(a,b,c,e,k)=>{if(a&&b&&c&&e){let n=parseInt(col.slice(1),16);polys.push({a,b,c,d:e,col:`rgb(${((n>>16)&255)*k|0},${((n>>8)&255)*k|0},${(n&255)*k|0})`,z:(a.z+b.z+c.z+e.z)/4})}};add(p0,p1,p2,p3,.82);add(p5,p4,p7,p6,.88);add(p4,p0,p3,p7,.7);add(p1,p5,p6,p2,.92);add(p3,p2,p6,p7,1);add(p4,p5,p1,p0,.55)}
function boom(x,y,z){beep('sawtooth',130,22,.5,.14);for(let i=0;i<14;i++)pts.push({x,y,z,vx:(Math.random()-.5)*8,vy:Math.random()*8+3,vz:(Math.random()-.5)*8,l:1,c:i%2?'#f60':'#443'})}
function shoot(){if(!au)snd();beep('square',780,95,.14,.07);beep('triangle',220,42,.18,.12);pl.rec=1;beams.push({l:1});let fx=Math.sin(pl.yaw),fz=Math.cos(pl.yaw);if(cl&&cl.connected)cl.publish(tp,JSON.stringify({t:'s',id:myId,x1:pl.x,z1:pl.z,x2:pl.x+fx*38,z2:pl.z+fz*38}));for(let id in peers){let p=peers[id];if(p.tm==pl.tm)continue;let dx=p.x-pl.x,dz=p.z-pl.z,fw=dx*fx+dz*fz,sd=Math.abs(dx*fz-dz*fx);if(fw>.5&&sd<1.35&&fw<38){boom(p.x,1.5,p.z);document.getElementById('sc').textContent=++sc;fr+=pl.tm=='blue'?.08:-.08;updF();if(cl&&cl.connected){cl.publish(tp,JSON.stringify({t:'h',id:myId,tg:id,d:DF[df].dmg}));cl.publish(tp,JSON.stringify({t:'f',id:myId,v:fr}))}return}}let hi=-1,bd=99;bots.forEach((b,i)=>{if(b.tm==pl.tm)return;let dx=b.x-pl.x,dz=b.z-pl.z,fw=dx*fx+dz*fz,sd=Math.abs(dx*fz-dz*fx);if(fw>1&&sd<1.35&&fw<bd){bd=fw;hi=i}});if(hi!=-1){let d=bots.splice(hi,1).pop();boom(d.x,1.5,d.z);document.getElementById('sc').textContent=++sc;fr+=pl.tm=='blue'?.05:-.05;updF();if(cl&&cl.connected)cl.publish(tp,JSON.stringify({t:'f',id:myId,v:fr}))}}
function man(x,y,z,ry,w,cc){let u=(C[cc]||C.ru).u,h=(C[cc]||C.ru).h,sw=Math.sin(w)*.6,bb=Math.abs(Math.sin(w))*.14;box(x-.22*Math.cos(ry)+sw*.35*Math.sin(ry),y+.55,z+.22*Math.sin(ry)+sw*.35*Math.cos(ry),.36,1.1,.36,'#3b3226',ry);box(x+.22*Math.cos(ry)-sw*.35*Math.sin(ry),y+.55,z-.22*Math.sin(ry)-sw*.35*Math.cos(ry),.36,1.1,.36,'#3b3226',ry);box(x,y+1.65+bb,z,.9,1.1,.48,u,ry);box(x-Math.cos(ry)*.65,y+1.65+bb,z+Math.sin(ry)*.65,.35,1.05,.35,u,ry);box(x+Math.cos(ry)*.65,y+1.65+bb,z-Math.sin(ry)*.65,.35,1.05,.35,u,ry);box(x,y+2.55+bb,z,.55,.55,.55,'#f2c94c',ry);box(x,y+2.86+bb,z,.86,.16,.86,h,ry);box(x+Math.cos(ry)*.65+Math.sin(ry)*.5,y+1.75+bb,z-Math.sin(ry)*.65+Math.cos(ry)*.5,.12,.16,1.8,'#4a2e16',ry)}
setC();
const blueList=new Array('ru','fr','uk','us','it','rs');
const redList=new Array('de','ah','tr','bg');
function loop(){
  t+=.016;polys=[];let cfg=DF[df],cInfo=CH[ch],fx=Math.sin(pl.yaw),fz=Math.cos(pl.yaw);
  if(K.KeyW||K.ArrowUp){pl.x+=fx*.16;pl.z+=fz*.16}if(K.KeyS||K.ArrowDown){pl.x-=fx*.16;pl.z-=fz*.16}if(K.ArrowLeft)pl.yaw-=.045;if(K.ArrowRight)pl.yaw+=.045;
  pl.x=Math.max(-22,Math.min(22,pl.x));pl.z=Math.max(-22,Math.min(22,pl.z));pl.rec=Math.max(0,pl.rec-.12);
  let sk=g.createLinearGradient(0,0,0,H);sk.addColorStop(0,cInfo.a);sk.addColorStop(1,cInfo.b);g.fillStyle=sk;g.fillRect(0,0,W,H);
  if(bots.length<8&&Math.random()<cfg.sr){let al=Math.random()<.45,tm=al?pl.tm:(pl.tm=='blue'?'red':'blue'),cl=tm=='blue'?blueList:redList;bots.push({x:(Math.random()-.5)*20,z:tm=='blue'?-20:20,tm,c:al?pl.c:cl[Math.random()*cl.length|0],o:Math.random()*5})}
  let fzLine=(fr-.5)*40;box(0,-.5,0,50,1,52,'#3d3126');box(0,.04,fzLine,48,.08,.5,'#ffee00');box(0,3.5,-22,.25,7,.25,'#4a2e16');box(0,3.5,22,.25,7,.25,'#4a2e16');
  for(let x=-20;x<=20;x+=3){box(x,.4,-22,2.8,.9,1.2,'#2c5aa0');box(x,.4,22,2.8,.9,1.2,'#9e332b')}
  if(cInfo.tk){let tz=((t*1.8)%34)-14;box(-7,1.3,tz,2.8,1.9,5.4,'#4b5338');box(-7,1.5,tz+.3,2.4,2.2,3.6,'#3f472e')}
  bots.forEach(b=>{let d=b.tm=='blue'?1:-1;if((d==1&&b.z<fzLine-1.5)||(d==-1&&b.z>fzLine+1.5))b.z+=d*cfg.sp*.016;man(b.x,0,b.z,d==1?0:Math.PI,t*9+b.o,b.c);if(b.tm!=pl.tm&&Math.random()<.002*df&&Math.hypot(b.x-pl.x,b.z-pl.z)<22){hp-=cfg.ed;document.getElementById('hp').textContent=Math.max(0,hp);if(hp<=0){boom(pl.x,1.5,pl.z);resp()}}});
  for(let id in peers){let p=peers[id];man(p.x,0,p.z,p.y,t*8,p.c)}
  pts.forEach(p=>{p.x+=p.vx*.016;p.y+=p.vy*.016;p.z+=p.vz*.016;p.vy-=11*.016;p.l-=.03;if(p.l>0)box(p.x,Math.max(.2,p.y),p.z,p.l*.9,p.l*.9,p.l*.9,p.c)});pts=pts.filter(p=>p.l>0);
  polys.sort((a,b)=>b.z-a.z).forEach(p=>{g.beginPath();g.moveTo(p.a.x,p.a.y);g.lineTo(p.b.x,p.b.y);g.lineTo(p.c.x,p.c.y);g.lineTo(p.d.x,p.d.y);g.closePath();g.fillStyle=p.col;g.fill();g.strokeStyle='rgba(0,0,0,.3)';g.stroke()});
  let ft=proj({x:0,y:6.8,z:pl.tm=='blue'?-22:22});if(ft&&ft.z>1){let fw=Math.min(130,600/ft.z);flag(g,pl.c,ft.x,ft.y,fw,fw*.65)}
  for(let id in peers){let p=peers[id],hp=proj({x:p.x,y:3.5,z:p.z});if(hp){g.fillStyle=p.tm=='blue'?'#6bf':'#f66';g.textAlign='center';g.fillText(p.n,hp.x,hp.y)}}
  nBeams.forEach(nb=>{nb.l-=.12;let a=proj({x:nb.x1,y:1.8,z:nb.z1}),b=proj({x:nb.x2,y:1.8,z:nb.z2});if(a&&b&&nb.l>0){g.strokeStyle='#f70';g.lineWidth=9*nb.l;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.strokeStyle='#fe0';g.lineWidth=4*nb.l;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}});nBeams=nBeams.filter(nb=>nb.l>0);
  let gx=W*.64,gy=H-210+pl.rec*35,w=40,h=230;
  beams.forEach(b=>{b.l-=.14;if(b.l>0){let bw=24*b.l;g.strokeStyle='#000';g.lineWidth=bw+6;g.beginPath();g.moveTo(gx+w/2,gy+10);g.lineTo(W/2,H/2);g.stroke();g.strokeStyle='#f70';g.lineWidth=bw;g.beginPath();g.moveTo(gx+w/2,gy+10);g.lineTo(W/2,H/2);g.stroke();g.strokeStyle='#fe0';g.lineWidth=bw*.45;g.beginPath();g.moveTo(gx+w/2,gy+10);g.lineTo(W/2,H/2);g.stroke()}});beams=beams.filter(b=>b.l>0);
  g.fillStyle='#7a7a7a';g.fillRect(gx,gy,w,h*.62);g.strokeStyle='#000';g.lineWidth=4;g.strokeRect(gx,gy,w,h*.62);g.fillStyle='#000';g.beginPath();g.arc(gx+w/2,gy+4,w*.44,0,Math.PI);g.fill();g.fillStyle='#b36b43';g.fillRect(gx,gy+h*.62,w,h*.38);g.strokeRect(gx,gy+h*.62,w,h*.38);g.strokeStyle='#fe0';g.lineWidth=2;g.strokeRect(W/2-9,H/2-9,18,18);
  requestAnimationFrame(loop);
}loop();
</script></body></html>
