<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>WW1 ROBLOX 3D - ШТУРМ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1510; overflow: hidden; font: bold 15px monospace; color: #fff; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; }
  #sub { align-self: center; background: rgba(20, 12, 8, .85); border: 2px solid #e08e36; padding: 10px 20px; text-align: center; max-width: 700px; color: #ffe7c2; letter-spacing: 1px; }
  button { padding: 9px 18px; font: inherit; background: #6b3b1e; color: #fff; border: 2px solid #e08e36; cursor: pointer; pointer-events: auto; }
  button:hover { background: #8c4f2b; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div class="top-bar">
    <button onclick="toggleAudio()">🔊 ВКЛЮЧИТЬ ЗВУК БОЯ</button>
    <div style="background:rgba(0,0,0,.65);padding:6px 12px;border:1px solid #888">1918 • АТАКА НА ЗАПАДНОМ ФРОНТЕ</div>
  </div>
  <div id="sub">В АТАКУ! ПЕХОТА И ТАНКИ ШТУРМУЮТ ВРАЖЕСКИЕ ОКОПЫ!</div>
</div>

<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const sub = document.getElementById('sub');
let W = cv.width = innerWidth, H = cv.height = innerHeight;
let ac = null, audioOn = false, t = 0;
let polys = [], particles = [], bullets = [];
let cam = { x: -12, y: 6, z: -14, lx: 0, ly: 2, lz: 4 };

onresize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };

function toggleAudio() {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    audioOn = !audioOn;
  } catch (e) {}
}

function playShot() {
  if (!audioOn || !ac) return;
  const o = ac.createOscillator(), gn = ac.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(380, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(60, ac.currentTime + 0.09);
  gn.gain.setValueAtTime(0.05, ac.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.1);
  o.connect(gn); gn.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + 0.1);
}

function playBoom() {
  if (!audioOn || !ac) return;
  const o = ac.createOscillator(), gn = ac.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(120, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(24, ac.currentTime + 0.55);
  gn.gain.setValueAtTime(0.18, ac.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.6);
  o.connect(gn); gn.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + 0.6);
}

function project(p) {
  let dx = p.x - cam.x, dy = p.y - cam.y, dz = p.z - cam.z;
  let fx = cam.lx - cam.x, fy = cam.ly - cam.y, fz = cam.lz - cam.z;
  let fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;
  let rx = fz, rz = -fx, rl = Math.hypot(rx, rz) || 1; rx /= rl; rz /= rl;
  let ux = fy * rz, uy = fz * rx - fx * rz, uz = -fy * rx;
  let cx = dx * rx + dz * rz;
  let cy = dx * ux + dy * uy + dz * uz;
  let cz = dx * fx + dy * fy + dz * fz;
  if (cz <= 0.25) return null;
  let s = (H * 0.85) / cz;
  return { x: W / 2 + cx * s, y: H / 2 - cy * s, z: cz };
}

function addBox(x, y, z, w, h, d, col, ry = 0) {
  const hw = w / 2, hh = h / 2, hd = d / 2;
  const cos = Math.cos(ry), sin = Math.sin(ry);
  const raw = [
    [-hw,-hh,-hd],[hw,-hh,-hd],[hw,hh,-hd],[-hw,hh,-hd],
    [-hw,-hh,hd],[hw,-hh,hd],[hw,hh,hd],[-hw,hh,hd]
  ];
  const pts = raw.map(v => ({
    x: x + v[0]*cos - v[2]*sin,
    y: y + v[1],
    z: z + v[0]*sin + v[2]*cos
  }));
  const faces = [
    { i:, c: shade(col, 0.82) },
    { i:, c: shade(col, 0.88) },
    { i:, c: shade(col, 0.70) },
    { i:, c: shade(col, 0.92) },
    { i:, c: col },
    { i:, c: shade(col, 0.55) }
  ];
  faces.forEach(f => {
    const pr = f.i.map(idx => project(pts[idx]));
    if (pr.some(p => !p)) return;
    const zAvg = (pr[0].z + pr[1].z + pr[2].z + pr[3].z) * 0.25;
    polys.push({ pts: pr, col: f.c, z: zAvg });
  });
}

function shade(hex, k) {
  let n = parseInt(hex.slice(1), 16);
  let r = Math.min(255, ((n >> 16) & 255) * k) | 0;
  let gr = Math.min(255, ((n >> 8) & 255) * k) | 0;
  let b = Math.min(255, (n & 255) * k) | 0;
  return `rgb(${r},${gr},${b})`;
}
function drawSoldier(x, y, z, ry, walk, uniformCol, helmetCol, firing = false) {
  const sw = Math.sin(walk) * 0.65;
  const bob = Math.abs(Math.sin(walk)) * 0.14;
  // Ноги в беге
  addBox(x - 0.22*Math.cos(ry) + sw*0.35*Math.sin(ry), y + 0.55, z + 0.22*Math.sin(ry) + sw*0.35*Math.cos(ry), 0.36, 1.1, 0.36, '#3b3226', ry);
  addBox(x + 0.22*Math.cos(ry) - sw*0.35*Math.sin(ry), y + 0.55, z - 0.22*Math.sin(ry) - sw*0.35*Math.cos(ry), 0.36, 1.1, 0.36, '#3b3226', ry);
  // Торс
  addBox(x, y + 1.65 + bob, z, 0.9, 1.1, 0.48, uniformCol, ry);
  addBox(x, y + 1.25 + bob, z, 0.94, 0.16, 0.52, '#2b1d0e', ry);
  // Руки
  addBox(x - 0.65*Math.cos(ry), y + 1.65 + bob, z + 0.65*Math.sin(ry), 0.35, 1.05, 0.35, uniformCol, ry);
  addBox(x + 0.65*Math.cos(ry), y + 1.65 + bob, z - 0.65*Math.sin(ry), 0.35, 1.05, 0.35, uniformCol, ry);
  // Голова и каска
  addBox(x, y + 2.55 + bob, z, 0.55, 0.55, 0.55, '#f2c94c', ry);
  addBox(x, y + 2.86 + bob, z, 0.86, 0.16, 0.86, helmetCol, ry);
  addBox(x, y + 2.98 + bob, z, 0.58, 0.2, 0.58, helmetCol, ry);
  // Винтовка и вспышка выстрела
  const gx = x + 0.65*Math.cos(ry) + 0.5*Math.sin(ry);
  const gz = z - 0.65*Math.sin(ry) + 0.5*Math.cos(ry);
  addBox(gx, y + 1.75 + bob, gz, 0.12, 0.16, 1.8, '#4a2e16', ry);
  if (firing) {
    const fx = x + 0.65*Math.cos(ry) + 1.6*Math.sin(ry);
    const fz = z - 0.65*Math.sin(ry) + 1.6*Math.cos(ry);
    addBox(fx, y + 1.78 + bob, fz, 0.35, 0.35, 0.35, '#ffdd33', t * 15);
  }
}

function drawTank(x, y, z) {
  const shake = Math.sin(t * 30) * 0.05;
  addBox(x, y + 1.3 + shake, z, 2.8, 1.9, 5.4, '#4b5338', 0);
  addBox(x, y + 1.5 + shake, z + 0.3, 2.4, 2.2, 3.6, '#3f472e', 0);
  addBox(x - 1.7, y + 1.2 + shake, z + 0.4, 0.8, 1.1, 1.5, '#3a402b', 0);
  addBox(x + 1.7, y + 1.2 + shake, z + 0.4, 0.8, 1.1, 1.5, '#3a402b', 0);
  addBox(x - 1.7, y + 1.25 + shake, z + 1.5, 0.18, 0.18, 1.3, '#222222', 0);
  addBox(x + 1.7, y + 1.25 + shake, z + 1.5, 0.18, 0.18, 1.3, '#222222', 0);
  addBox(x - 1.35, y + 0.9, z, 0.55, 1.8, 5.8, '#262421', 0);
  addBox(x + 1.35, y + 0.9, z, 0.55, 1.8, 5.8, '#262421', 0);
}

function drawBiplane(x, y, z, col) {
  addBox(x, y, z, 0.7, 0.7, 4.2, col, 0);
  addBox(x, y - 0.1, z + 0.5, 6.2, 0.14, 1.1, shade(col, 1.15), 0);
  addBox(x, y + 0.9, z + 0.6, 6.4, 0.14, 1.1, shade(col, 1.15), 0);
  addBox(x - 1.8, y + 0.4, z + 0.55, 0.1, 0.95, 0.1, '#333333', 0);
  addBox(x + 1.8, y + 0.4, z + 0.55, 0.1, 0.95, 0.1, '#333333', 0);
  addBox(x, y + 0.2, z - 1.9, 1.8, 0.12, 0.7, col, 0);
  addBox(x, y, z + 2.2, 0.15, 1.5, 0.1, '#d9b382', t * 35);
}

function spawnExplosion(x, y, z) {
  playBoom();
  for (let i = 0; i < 20; i++) {
    particles.push({
      x, y, z,
      vx: (Math.random() - 0.5) * 8,
      vy: Math.random() * 9 + 3,
      vz: (Math.random() - 0.5) * 8,
      life: 1.0,
      col: i % 3 === 0 ? '#ff4500' : (i % 3 === 1 ? '#ffaa00' : '#3d3832')
    });
  }
}

function spawnBullet(x, y, z, vz) {
  playShot();
  bullets.push({ x, y, z, vz, life: 1.2 });
}

// Отряд атакующих солдат (постоянно бегут волнами)
const squad = [
  { x: -6.5, z: -12, spd: 3.1, u: '#5c5338', h: '#4a4533', off: 0 },
  { x: -3.5, z: -10, spd: 3.4, u: '#5c5338', h: '#4a4533', off: 1.2 },
  { x:  3.5, z: -11, spd: 3.2, u: '#4a5c6b', h: '#3b4a57', off: 2.1 },
  { x:  6.8, z: -13, spd: 3.5, u: '#5c5338', h: '#4a4533', off: 0.7 },
  { x: -8.5, z: -15, spd: 3.0, u: '#4a5c6b', h: '#3b4a57', off: 1.8 },
  { x:  8.5, z: -14, spd: 3.3, u: '#5c5338', h: '#4a4533', off: 2.7 }
];

function loop() {
  t += 0.016;
  polys = [];

  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#261c14');
  sky.addColorStop(0.55, '#7a4b2a');
  sky.addColorStop(1, '#36271b');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  // Динамичный облет камеры вокруг поля боя
  cam.x = Math.sin(t * 0.35) * 14;
  cam.y = 5.5 + Math.cos(t * 0.5) * 1.5;
  cam.z = -12 + Math.sin(t * 0.25) * 6;
  cam.lx = 0; cam.ly = 2; cam.lz = 5;

  // Частые артиллерийские взрывы
  if (Math.random() < 0.06) {
    spawnExplosion((Math.random() - 0.5) * 26, 0.5, Math.random() * 26 - 6);
  }

  // Земля, окопы и воронки
  addBox(0, -0.5, 6, 50, 1, 56, '#3d3126');
  for (let x = -18; x <= 18; x += 3) {
    addBox(x, 0.35, -12, 2.8, 0.8, 1.2, '#5c4632');
    addBox(x, 0.45, 18, 2.8, 1.0, 1.4, '#4a3828');
    addBox(x, 0.9, 17.2, 1.3, 0.45, 0.6, '#9c8663');
  }

  // Колючая проволока и руины
  for (let x = -15; x <= 15; x += 3.5) {
    if (Math.abs(x + 2.5) < 2.2 || Math.abs(x - 2.5) < 2.2) continue;
    addBox(x, 0.7, 4, 0.15, 1.4, 0.15, '#2b1d12', 0.3);
    addBox(x + 1.7, 0.75, 4, 3.5, 0.08, 0.08, '#777777', 0.2);
  }
  addBox(-12, 2.0, 8, 1.2, 4.0, 4.5, '#6e3b2e', 0.1);
  addBox(13, 1.8, 6, 1.2, 3.6, 4.0, '#6e3b2e', -0.15);

  // Два танка Mark IV идут в атаку по циклу
  const tank1Z = ((t * 2.2) % 34) - 14;
  const tank2Z = (((t + 6) * 2.0) % 34) - 14;
  drawTank(-2.5, 0, tank1Z);
  drawTank(2.5, 0, tank2Z);

  // Бегущие и стреляющие солдаты Антанты
  squad.forEach(s => {
    s.z += s.spd * 0.016;
    if (s.z > 15) s.z = -13;
    const isFiring = Math.sin(t * 12 + s.off * 5) > 0.88;
    if (isFiring && Math.random() < 0.25) spawnBullet(s.x + 0.5, 1.8, s.z + 1.5, 38);
    drawSoldier(s.x, 0, s.z, 0, t * 11 + s.off, s.u, s.h, isFiring);
  });

  // Солдаты обороны в дальнем окопе (отстреливаются)
  [-6, -2, 2, 6].forEach((dx, idx) => {
    const defFire = Math.cos(t * 14 + idx * 2) > 0.85;
    if (defFire && Math.random() < 0.25) spawnBullet(dx - 0.5, 1.8, 15.5, -38);
    drawSoldier(dx, 0, 16.8, Math.PI, 0, '#5a6358', '#3e453d', defFire);
  });

  // Два биплана в небе
  const p1Z = ((t * 18) % 60) - 22;
  const p2Z = (((t + 2) * 18) % 60) - 22;
  drawBiplane(-5 + Math.sin(t * 2) * 2, 10.5, p1Z, '#8c2d23');
  drawBiplane(6 + Math.cos(t * 2.2) * 2, 12.0, p2Z, '#3d5938');

  // Трассирующие пули
  bullets.forEach(b => {
    b.z += b.vz * 0.016;
    b.life -= 0.025;
    if (b.life > 0) addBox(b.x, b.y, b.z, 0.08, 0.08, 1.1, '#ffee55');
  });
  bullets = bullets.filter(b => b.life > 0);

  // Частицы взрывов
  particles.forEach(p => {
    p.x += p.vx * 0.016;
    p.y += p.vy * 0.016;
    p.z += p.vz * 0.016;
    p.vy -= 11 * 0.016;
    p.life -= 0.028;
    if (p.life > 0) addBox(p.x, Math.max(0.2, p.y), p.z, p.life * 0.95, p.life * 0.95, p.life * 0.95, p.col);
  });
  particles = particles.filter(p => p.life > 0);

  // Отрисовка всех 3D-граней
  polys.sort((a, b) => b.z - a.z);
  polys.forEach(p => {
    g.beginPath();
    g.moveTo(p.pts[0].x, p.pts[0].y);
    g.lineTo(p.pts[1].x, p.pts[1].y);
    g.lineTo(p.pts[2].x, p.pts[2].y);
    g.lineTo(p.pts[3].x, p.pts[3].y);
    g.closePath();
    g.fillStyle = p.col;
    g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.3)';
    g.lineWidth = 1;
    g.stroke();
  });

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
