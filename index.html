<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>WW1 ROBLOX 3D - ВЕЛИКАЯ ВОЙНА</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1815; overflow: hidden; font: bold 15px monospace; color: #fff; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; }
  #sub { align-self: center; background: rgba(20, 15, 10, .85); border: 2px solid #c89d54; padding: 10px 20px; text-align: center; max-width: 680px; color: #f4e4c1; letter-spacing: 1px; }
  #end { position: fixed; inset: 0; background: rgba(10, 8, 5, .92); display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: 1.5s; pointer-events: none; text-align: center; }
  #end.show { opacity: 1; pointer-events: auto; }
  #end h1 { font-size: 54px; color: #c89d54; letter-spacing: 6px; text-shadow: 0 0 20px rgba(200, 157, 84, .6); }
  button { padding: 9px 18px; font: inherit; background: #5c4928; color: #fff; border: 2px solid #c89d54; cursor: pointer; pointer-events: auto; }
  button:hover { background: #7a6236; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div class="top-bar">
    <button onclick="toggleAudio()">🔊 ЗВУК / МАРШ</button>
    <div style="background:rgba(0,0,0,.6);padding:6px 12px;border:1px solid #666">1918 • ЗАПАДНЫЙ ФРОНТ</div>
  </div>
  <div id="sub">11 НОЯБРЯ 1918 ГОДА. ПОСЛЕДНИЙ ШТУРМ ПЕРЕД ПЕРЕМИРИЕМ...</div>
</div>

<div id="end">
  <h1>ПЕРЕМИРИЕ</h1>
  <p style="color:#ccc; margin:14px 20px; max-width:500px; line-height:1.5">11:00 — Орудия замолчали. Первая мировая война окончена.</p>
  <button onclick="location.reload()">ПОВТОРИТЬ СЦЕНУ</button>
</div>

<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const sub = document.getElementById('sub'), endDiv = document.getElementById('end');
let W = cv.width = innerWidth, H = cv.height = innerHeight;
let ac = null, audioOn = false, t = 0, ended = 0;
let polys = [], particles = [];
let cam = { x: -14, y: 7, z: -16, lx: 0, ly: 2, lz: 4 };

onresize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };

function toggleAudio() {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    audioOn = !audioOn;
    if (audioOn) playMarch();
  } catch (e) {}
}

function playMarch() {
  if (!audioOn || !ac) return;
  const notes = [261.6, 261.6, 329.6, 392.0, 329.6, 261.6, 293.7, 196.0, 261.6];
  notes.forEach((f, i) => {
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = 'sawtooth';
    o.frequency.value = f;
    gn.gain.setValueAtTime(0.06, ac.currentTime + i * 0.28);
    gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + i * 0.28 + 0.25);
    o.connect(gn); gn.connect(ac.destination);
    o.start(ac.currentTime + i * 0.28);
    o.stop(ac.currentTime + i * 0.28 + 0.26);
  });
  if (!ended) setTimeout(playMarch, 2800);
}

function playBoom() {
  if (!audioOn || !ac) return;
  const o = ac.createOscillator(), gn = ac.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(110, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(28, ac.currentTime + 0.5);
  gn.gain.setValueAtTime(0.18, ac.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.55);
  o.connect(gn); gn.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + 0.55);
}

function project(p) {
  let dx = p.x - cam.x, dy = p.y - cam.y, dz = p.z - cam.z;
  let fx = cam.lx - cam.x, fy = cam.ly - cam.y, fz = cam.lz - cam.z;
  let fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;
  let rx = fz, rz = -fx, rl = Math.hypot(rx, rz) || 1; rx /= rl; rz /= rl;
  let ux = fy * rz, uy = fz * rx - fx * rz, uz = -fy * rx;
  let cx = dx * rx + dz * rz;
  let cy = dx * ux + dy * uy + dz * uz;
  let cz = dx * fx + dy * fy + dz * fz;
  if (cz <= 0.2) return null;
  let s = (H * 0.85) / cz;
  return { x: W / 2 + cx * s, y: H / 2 - cy * s, z: cz };
}

function addBox(x, y, z, w, h, d, col, ry = 0) {
  const hw = w / 2, hh = h / 2, hd = d / 2;
  const cos = Math.cos(ry), sin = Math.sin(ry);
  const pts = [
    [-hw,-hh,-hd],[hw,-hh,-hd],[hw,hh,-hd],[-hw,hh,-hd],
    [-hw,-hh,hd],[hw,-hh,hd],[hw,hh,hd],[-hw,hh,hd]
  ].map(v => ({
    x: x + v*cos - v*sin,
    y: y + v,
    z: z + v*sin + v*cos
  }));
  const faces = [
    { i:, c: shade(col, 0.85) },
    { i:, c: shade(col, 0.85) },
    { i:, c: shade(col, 0.72) },
    { i:, c: shade(col, 0.92) },
    { i:, c: col },
    { i:, c: shade(col, 0.55) }
  ];
  faces.forEach(f => {
    const pr = f.i.map(idx => project(pts[idx]));
    if (pr.some(p => !p)) return;
    const zAvg = pr.reduce((a, b) => a + b.z, 0) / 4;
    polys.push({ pts: pr, col: f.c, z: zAvg });
  });
}

function shade(hex, k) {
  let n = parseInt(hex.slice(1), 16);
  let r = Math.min(255, ((n >> 16) & 255) * k) | 0;
  let gr = Math.min(255, ((n >> 8) & 255) * k) | 0;
  let b = Math.min(255, (n & 255) * k) | 0;
  return `rgb(${r},${gr},${b})`;
}
function drawSoldier(x, y, z, ry, walk, uniformCol, helmetCol, hasFlag = false) {
  const sw = Math.sin(walk) * 0.45;
  addBox(x - 0.22*Math.cos(ry), y + 0.55, z + 0.22*Math.sin(ry), 0.36, 1.1, 0.36, '#3b3226', ry + sw*0.2);
  addBox(x + 0.22*Math.cos(ry), y + 0.55, z - 0.22*Math.sin(ry), 0.36, 1.1, 0.36, '#3b3226', ry - sw*0.2);
  addBox(x, y + 1.65, z, 0.9, 1.1, 0.48, uniformCol, ry);
  addBox(x, y + 1.25, z, 0.94, 0.16, 0.52, '#2b1d0e', ry);
  addBox(x - 0.65*Math.cos(ry), y + 1.65, z + 0.65*Math.sin(ry), 0.35, 1.05, 0.35, uniformCol, ry);
  addBox(x + 0.65*Math.cos(ry), y + 1.65, z - 0.65*Math.sin(ry), 0.35, 1.05, 0.35, uniformCol, ry);
  addBox(x, y + 2.55, z, 0.55, 0.55, 0.55, '#f2c94c', ry);
  addBox(x, y + 2.86, z, 0.85, 0.16, 0.85, helmetCol, ry);
  addBox(x, y + 2.98, z, 0.58, 0.2, 0.58, helmetCol, ry);
  addBox(x + 0.65*Math.cos(ry) + 0.4*Math.sin(ry), y + 1.75, z - 0.65*Math.sin(ry) + 0.4*Math.cos(ry), 0.12, 0.16, 1.8, '#4a2e16', ry);
  addBox(x + 0.65*Math.cos(ry) + 1.35*Math.sin(ry), y + 1.78, z - 0.65*Math.sin(ry) + 1.35*Math.cos(ry), 0.05, 0.08, 0.45, '#cccccc', ry);
  if (hasFlag) {
    addBox(x - 0.7, y + 2.6, z, 0.08, 2.8, 0.08, '#5c3a21', 0);
    addBox(x - 0.7, y + 3.6, z + 0.55, 0.06, 0.7, 1.0, '#ffffff', Math.sin(t*4)*0.15);
  }
}

function drawTank(x, y, z) {
  addBox(x, y + 1.3, z, 2.8, 1.9, 5.4, '#4b5338', 0);
  addBox(x, y + 1.5, z + 0.3, 2.4, 2.2, 3.6, '#3f472e', 0);
  addBox(x - 1.7, y + 1.2, z + 0.4, 0.8, 1.1, 1.5, '#3a402b', 0);
  addBox(x + 1.7, y + 1.2, z + 0.4, 0.8, 1.1, 1.5, '#3a402b', 0);
  addBox(x - 1.7, y + 1.25, z + 1.5, 0.18, 0.18, 1.3, '#222222', 0);
  addBox(x + 1.7, y + 1.25, z + 1.5, 0.18, 0.18, 1.3, '#222222', 0);
  addBox(x - 1.35, y + 0.9, z, 0.55, 1.8, 5.8, '#262421', 0);
  addBox(x + 1.35, y + 0.9, z, 0.55, 1.8, 5.8, '#262421', 0);
}

function drawBiplane(x, y, z) {
  addBox(x, y, z, 0.7, 0.7, 4.2, '#8c2d23', 0);
  addBox(x, y - 0.1, z + 0.5, 6.2, 0.14, 1.1, '#a6382c', 0);
  addBox(x, y + 0.9, z + 0.6, 6.4, 0.14, 1.1, '#a6382c', 0);
  addBox(x - 1.8, y + 0.4, z + 0.55, 0.1, 0.95, 0.1, '#333333', 0);
  addBox(x + 1.8, y + 0.4, z + 0.55, 0.1, 0.95, 0.1, '#333333', 0);
  addBox(x, y + 0.2, z - 1.9, 1.8, 0.12, 0.7, '#a6382c', 0);
  addBox(x, y, z + 2.2, 0.15, 1.5, 0.1, '#d9b382', t * 25);
}

function spawnExplosion(x, y, z) {
  playBoom();
  for (let i = 0; i < 18; i++) {
    particles.push({
      x, y, z,
      vx: (Math.random() - 0.5) * 6,
      vy: Math.random() * 7 + 2,
      vz: (Math.random() - 0.5) * 6,
      life: 1.0,
      col: i % 2 === 0 ? '#ff6a00' : '#4a453e'
    });
  }
}

function loop() {
  t += 0.016;
  polys = [];

  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#2b241d');
  sky.addColorStop(0.55, '#6e5239');
  sky.addColorStop(1, '#3b2e22');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  let tankZ = -8 + t * 1.45;
  if (tankZ > 11) tankZ = 11;

  if (t < 6) {
    sub.textContent = "1918 ГОД. ТАНК MARK IV ПРЕОДОЛЕВАЕТ НИЧЕЙНУЮ ЗЕМЛЮ...";
    cam = { x: -11 + t * 0.8, y: 5.5, z: tankZ - 9, lx: 0, ly: 2, lz: tankZ + 2 };
  } else if (t < 12) {
    sub.textContent = "БИПЛАНЫ ПРИКРЫВАЮТ ПЕХОТУ С ВОЗДУХА!";
    cam = { x: 10 - (t - 6) * 1.2, y: 7.5, z: tankZ + 6, lx: 0, ly: 2.5, lz: tankZ };
  } else if (t < 17) {
    sub.textContent = "11:00 — СИГНАЛ О ПРЕКРАЩЕНИИ ОГНЯ. ПОДНЯТ БЕЛЫЙ ФЛАГ!";
    cam = { x: -6, y: 4.5, z: 4, lx: 0, ly: 2.2, lz: 11 };
  } else if (!ended) {
    ended = 1;
    endDiv.classList.add('show');
  }

  if (t < 12 && Math.random() < 0.035) {
    spawnExplosion((Math.random() - 0.5) * 24, 0.5, Math.random() * 20 - 2);
  }

  addBox(0, -0.5, 6, 46, 1, 52, '#3d3126');
  for (let x = -18; x <= 18; x += 3) {
    addBox(x, 0.35, -10, 2.8, 0.8, 1.2, '#5c4632');
    addBox(x, 0.45, 16, 2.8, 1.0, 1.4, '#4a3828');
    addBox(x, 0.9, -9.4, 1.3, 0.45, 0.6, '#9c8663');
    addBox(x + 1.4, 0.9, -9.4, 1.3, 0.45, 0.6, '#8c7756');
  }

  for (let x = -14; x <= 14; x += 3.5) {
    if (Math.abs(x) < 3.2 && tankZ > 1) continue;
    addBox(x, 0.7, 3, 0.15, 1.4, 0.15, '#2b1d12', 0.3);
    addBox(x + 1.7, 0.75, 3, 3.5, 0.08, 0.08, '#666666', 0.2);
    addBox(x + 1.7, 0.45, 3, 3.5, 0.08, 0.08, '#555555', -0.2);
  }

  addBox(-11, 2.0, 8, 1.2, 4.0, 4.5, '#6e3b2e', 0.1);
  addBox(12, 1.6, 5, 1.2, 3.2, 3.8, '#6e3b2e', -0.15);

  drawTank(0, 0, tankZ);

  const walkPhase = t < 12.5 ? t * 7 : 0;
  drawSoldier(-3.2, 0, tankZ - 2.5, 0, walkPhase, '#5c5338', '#4a4533');
  drawSoldier(3.2, 0, tankZ - 2.0, 0, walkPhase + 1.5, '#5c5338', '#4a4533');
  drawSoldier(-4.8, 0, tankZ - 4.2, 0, walkPhase + 0.8, '#4a5c6b', '#3b4a57');
  drawSoldier(4.5, 0, tankZ - 3.8, 0, walkPhase + 2.2, '#5c5338', '#4a4533', t >= 12);

  drawSoldier(-2.5, 0, 14.5, Math.PI, 0, '#5a6358', '#3e453d');
  drawSoldier(2.5, 0, 14.5, Math.PI, 0, '#5a6358', '#3e453d');

  const planeZ = ((t * 14) % 55) - 20;
  drawBiplane(-4 + Math.sin(t * 2) * 2, 10 + Math.cos(t * 2) * 0.8, planeZ);

  particles.forEach(p => {
    p.x += p.vx * 0.016;
    p.y += p.vy * 0.016;
    p.z += p.vz * 0.016;
    p.vy -= 9.8 * 0.016;
    p.life -= 0.025;
    if (p.life > 0) {
      addBox(p.x, Math.max(0.2, p.y), p.z, p.life * 0.9, p.life * 0.9, p.life * 0.9, p.col);
    }
  });
  particles = particles.filter(p => p.life > 0);

  polys.sort((a, b) => b.z - a.z);
  polys.forEach(p => {
    g.beginPath();
    g.moveTo(p.pts.x, p.pts.y);
    for (let i = 1; i < p.pts.length; i++) g.lineTo(p.pts[i].x, p.pts[i].y);
    g.closePath();
    g.fillStyle = p.col;
    g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.28)';
    g.lineWidth = 1;
    g.stroke();
  });

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
